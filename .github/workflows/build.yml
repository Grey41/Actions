name: JoBase Wheels

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to PyPI
        required: true
        type: boolean

jobs:
  windows:
    name: Windows ${{matrix.arch[0]}}
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          # - [x86_64, amd64]
          - [x86, win32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.arch[1]}}

      - name: Build wheels
        run: |
          foreach ($py in "3.13.9", "3.14.0") {
            curl -L -o python.zip https://www.python.org/ftp/python/$py/python-$py-${{matrix.arch[1]}}.zip
            Expand-Archive python.zip -DestinationPath python/$py -Force

            & ./python/$py/python.exe -m pip install build
            & ./python/$py/python.exe -m build --wheel
          }


