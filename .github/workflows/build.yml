name: JoBase Wheels

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to PyPI
        required: true
        type: boolean

jobs:
  windows:
    name: Windows ${{matrix.arch[0]}}
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          - [x86_64, amd64, x86_amd64]
          # - [x86, win32, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{matrix.arch[2]}}

          for %py in (3.13.9 3.14.0) do (
            curl -L -o python.zip https://www.python.org/ftp/python/%py/python-%py-${{matrix.arch[1]}}.zip
            tar -xf python.zip -C %py

            %py/python.exe -m build --wheel
            ls)


